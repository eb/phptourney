services:

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    volumes:
      - ./tmp/db/data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=WMxP7Xd9MVZtvZ1D

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5
    restart: unless-stopped
    environment:
      - PMA_ABSOLUTE_URI=http://localhost:8081
      - PMA_USER=root
      - PMA_PASSWORD=WMxP7Xd9MVZtvZ1D
      - MYSQL_ROOT_PASSWORD=WMxP7Xd9MVZtvZ1D
    ports:
      - 8081:80
    depends_on:
      - mariadb
    links:
      - mariadb:db

  smtp:
    image: bytemark/smtp:latest
    restart: unless-stopped
    environment:
      - RELAY_HOST=maildev
      - RELAY_PORT=1025

  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - 8082:1080

  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./app/:/var/www/html/
      - ./tmp/app/data:/var/www/html/data
    environment:
      - PHPTOURNEY_DB_HOST=db
      - PHPTOURNEY_DB_PORT=3306
      - PHPTOURNEY_DB_ROOT_PASSWORD=WMxP7Xd9MVZtvZ1D
      - PHPTOURNEY_DB_USERNAME=root
      - PHPTOURNEY_DB_PASSWORD=WMxP7Xd9MVZtvZ1D
      - PHPTOURNEY_DB_DATABASE=phptourney
      - PHPTOURNEY_MAIL_FROM_NAME=phpTourney
      - PHPTOURNEY_MAIL_FROM_ADDRESS=admin@phptourney.local
      - PHPTOURNEY_TOURNEY_NAME=phpTourney
      - PHPTOURNEY_HOST=http://localhost:8080
      - PHPTOURNEY_PATH=/
      - PHPTOURNEY_CONVERT=convert
      - PHPTOURNEY_RECAPTCHA_KEY=
      - PHPTOURNEY_RECAPTCHA_SECRET=
      - PHPTOURNEY_DEBUG=1
    ports:
      - 8080:80
    depends_on:
      - mariadb
      - smtp
    links:
      - mariadb:db
      - smtp:mail