<!-- BEGIN B_ADD_ACCOUNT -->
<table class="largebox" cellspacing="0">
<tr><th>Create Account</th></tr>
<tr>
	<td>
	<form id="add-account-form" action="" method="post">
		<input name="sid" value="{I_ID_SEASON}" type="hidden"/>
		<input name="mod" value="users" type="hidden"/>
		<input name="act" value="insert" type="hidden"/>
		<input name="opt" value="" type="hidden"/>

		<table class="form" cellspacing="0">
		<tr>
			<td>Username:</td>
			<td><input class="text" name="username" value="{I_USERNAME}" type="text" size="20"/></td>
			<td>&nbsp;</td>
		</tr>
		<tr>
			<td>Password:</td>
			<td><input class="text" name="password" value="{I_PASSWORD}" type="password" size="20"/></td>
			<td>&nbsp;</td>
		</tr>
		<tr>
			<td>Retype Password:</td>
			<td><input class="text" name="password_retyped" value="{I_PASSWORD_RETYPED}" type="password" size="20"/></td>
			<td>&nbsp;</td>
		</tr>
		<tr>
			<td>Email:</td>
			<td><input class="text" name="email" value="{I_EMAIL}" type="text" size="20"/></td>
			<td>&nbsp;</td>
		</tr>
		<tr>
			<td>Country:</td>
			<td>
			<select name="id_country" size="1">
				<option value=""></option>
<!-- BEGIN B_ADD_COUNTRY -->
				<option value="{I_ID_COUNTRY}">{I_COUNTRY}</option>
<!-- END B_ADD_COUNTRY -->
			</select>
			</td>
			<td class="help">Select the country you are playing from</td>
		</tr>
		<tr>
			<td>Notify:</td>
			<td><input type="checkbox" name="notify" value="1" checked="checked"/></td>
			<td class="help">For notification per mail, when you have a match</td>
		</tr>
<!-- BEGIN B_SIGNUP -->
		<tr>
			<td>Signup:</td>
			<td><input type="checkbox" name="signup" value="1" checked="checked"/></td>
			<td class="help">Uncheck it if you just want to register, but not participate in the tournament</td>
		</tr>
<!-- END B_SIGNUP -->
		<tr>
			<td>&nbsp;</td>
<!-- BEGIN B_SUBMIT -->
			<td><input class="submit" type="submit" value="Submit"/></td>
<!-- END B_SUBMIT -->
			<td>&nbsp;</td>
		</tr>
		</table>
<!-- BEGIN B_CAP_SCRIPT -->
	<script src="https://cdn.jsdelivr.net/npm/@cap.js/widget"></script>
	<script>
		var cap = new Cap({ apiEndpoint: '{I_CAP_FRONTEND_URL}/{I_CAP_SITE_KEY}/' });
		document.getElementById('add-account-form').addEventListener('submit', async function(e) {
			e.preventDefault();
			var btn = this.querySelector('input[type=submit]');
			btn.disabled = true;
			btn.value = 'Verifying...';
			var result = await cap.solve();
			var input = document.createElement('input');
			input.type = 'hidden';
			input.name = 'cap_token';
			input.value = result.token;
			this.appendChild(input);
			this.submit();
		});
	</script>
<!-- END B_CAP_SCRIPT -->
	</form>
	</td>
</tr>
</table>
<!-- END B_ADD_ACCOUNT -->
