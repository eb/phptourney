image:
  name: docker/compose:latest
  entrypoint: [""]

build:
  stage: build
  script:
    - docker build -t ${SUBDEVICE_REGISTRY_SERVER}/phptourney:${CI_COMMIT_TAG} .
  only:
    - tags

publish:
  stage: deploy
  variables:
    GIT_STRATEGY: none
  script:
    - docker login -u $SUBDEVICE_REGISTRY_USERNAME -p $SUBDEVICE_REGISTRY_PASSWORD $SUBDEVICE_REGISTRY_SERVER
    - docker push ${SUBDEVICE_REGISTRY_SERVER}/phptourney:${CI_COMMIT_TAG}
  after_script:
    - docker rmi ${SUBDEVICE_REGISTRY_SERVER}/phptourney:${CI_COMMIT_TAG}
  only:
    - tags

